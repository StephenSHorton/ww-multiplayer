name: Release

# Pushing a tag like `v0.1.0` builds the Windows exe and the macOS app and
# publishes a single GitHub Release with both attached, plus a SHA256SUMS
# file covering every asset. Tags containing a '-' (e.g. `v0.3.0-rc1`) are
# published as prereleases. Publishing a (non-pre)release then deploys
# the website (the last step starts pages.yml), so the site always
# describes the newest release.
#
# workflow_dispatch is a dry run: it builds and uploads both assets as
# workflow artifacts, but the `release` job runs only for tags, so nothing
# is published (and the site is not deployed).
#
# Release assets:
#   ww-multiplayer.exe         Windows: the app, the terminal menu and the CLI in one exe
#   ww-multiplayer-macos.zip   macOS: "WW Multiplayer/" with WW Multiplayer.app (universal),
#                              a ww-multiplayer CLI symlink, scripts/setup-mac-dolphin.sh, LICENSE
#   SHA256SUMS                 sha256 of both
#
# Code signing is optional and off until its secrets exist (owner
# decision: no signing for now). Each signing step is gated on its
# secrets, so a fork or this repo without them builds exactly the
# unsigned assets, with no failed or half-run step:
#   Windows (Authenticode, osslsigncode: signtool's Linux equivalent,
#   since the exe is cross-built on Linux):
#     WINDOWS_CERTIFICATE_PFX       base64 of a .pfx code-signing certificate
#     WINDOWS_CERTIFICATE_PASSWORD  its password
#   macOS (Developer ID + hardened runtime; scripts/build-mac.sh):
#     MACOS_CERTIFICATE_P12         base64 of a "Developer ID Application" .p12
#     MACOS_CERTIFICATE_PASSWORD    its password
#     MACOS_SIGN_IDENTITY           e.g. "Developer ID Application: Name (TEAMID)"
#   macOS notarization (needs the three above too):
#     APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (an app-specific password)
#
# The release's body is docs/release-notes/<tag>.md (scripts/release-notes.sh
# picks it; a prerelease tag without its own file uses its version's), with
# GitHub's generated "What's Changed" list after it. A tag without a
# finished notes file fails in the windows job, before anything is built.
#
# Game files: tools/check_game_files runs on the repo, on each asset after
# it is built and on the release job's downloaded assets before anything
# is published, and fails the release if any holds a Nintendo file or a
# save (internal/gamefiles: names, headers, zip entries, and every file
# read whole for game data inside it, so a game archive built into the
# exe's data fails the exe's step). On workflow_dispatch the notes step
# and the release job (with its artifacts guard) don't run: only the repo,
# exe and macOS zip guards do.
#
# We don't ship patched.dol — that would be a derivative of the entire
# Wind Waker DOL (copyrighted). The shipped binaries contain only our IP
# (the new code section + a list of in-DOL patch records); end users
# supply their own legitimate Wind Waker ISO and the app (or `patch`)
# patches it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Read-only by default: the build jobs hold the signing secrets and need
# no repo write. Only the release job asks for more (below).
permissions:
  contents: read

jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      # "true" only when both Windows signing secrets exist.
      HAS_WIN_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the blob-freshness gate below can see which
          # commits last touched the C source and blob.go.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # A tag needs its finished release notes (the release job's body):
      # fail now, not after both builds.
      - name: Release notes for this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME}"

      # No Nintendo file or save is tracked (internal/gamefiles; the local
      # check matrix in docs/TESTING.md runs the same before every push).
      - name: No game files in the repo
        run: go run ./tools/check_game_files

      # Verify committed blob hasn't accidentally been emptied. We don't
      # rebuild the C side here (needs devkitPPC + the user's vanilla
      # DOL); regenerate locally via `python scripts/extract_blob.py`
      # before tagging.
      - name: Verify committed blob
        run: |
          if ! grep -q "var T2Bytes" internal/inject/blob.go; then
            echo "::error::internal/inject/blob.go is missing T2Bytes — regenerate via scripts/extract_blob.py"
            exit 1
          fi
          if ! grep -q "var DOLPatches" internal/inject/blob.go; then
            echo "::error::internal/inject/blob.go is missing DOLPatches — regenerate via scripts/extract_blob.py"
            exit 1
          fi

      # Same checks docs/TESTING.md runs locally: blob.go against blob.stamp
      # and the committed C sources, the T2 budget, the mailbox layout.
      - name: Blob, code-space budget and mailbox layout checks
        run: >-
          go test -count=1
          -run 'TestBlobFresh|TestStampRoundTrip|TestT2EndsBelowMailbox|TestCheckBudget|TestBuildPyMatchesBlob|TestFrameShimLoadsCallbackSlot|TestMailboxLayout|TestModRegions'
          ./cmd/ww-multiplayer ./internal/inject/... ./wwapi/mailbox

      - name: go vet (Windows target)
        uses: ./.github/actions/go-vet
        with:
          goos: windows
          goarch: amd64

      # CLAUDE.md's "regenerate blob.go before tagging" rule, enforced:
      # if the newest commit touching the C source (inject/src,
      # inject/include) is newer than the newest commit touching
      # internal/inject/blob.go, the release would ship stale PPC code.
      # A shallow clone can't answer that: its tip commit is a graft root,
      # so both lookups return the tip's time and the comparison passes
      # whatever the blob's real age. Fail instead of passing silently.
      - name: Check blob.go is not older than the C source
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::error::blob-freshness gate needs the full history (fetch-depth: 0 on actions/checkout)"
            exit 1
          fi
          SRC=$(git log -1 --format=%ct -- inject/src inject/include)
          BLOB=$(git log -1 --format=%ct -- internal/inject/blob.go)
          echo "C source last changed: ${SRC}  blob.go last changed: ${BLOB}"
          if [ -z "$SRC" ] || [ -z "$BLOB" ]; then
            echo "::error::no commit found touching inject/src, inject/include or internal/inject/blob.go"
            exit 1
          fi
          if [ "$SRC" -gt "$BLOB" ]; then
            echo "::error::inject/src or inject/include changed after internal/inject/blob.go — rebuild the C side and run scripts/extract_blob.py before tagging"
            exit 1
          fi

      # -tags desktop,production compiles the app window (internal/gui,
      # Wails v2; it needs no cgo on Windows). Without them the exe is the
      # CLI + TUI only: Wails v2 refuses to start a window untagged.
      # cmd/ww-multiplayer/ww_windows.syso (committed; go generate in
      # main.go) adds the icon and the application manifest
      # (packaging/ww-multiplayer.exe.manifest: per-monitor DPI awareness,
      # Common Controls 6, asInvoker). The exe stays console-subsystem: one
      # exe for the app, `tui` and the CLI.
      - name: Build ww-multiplayer.exe (Windows amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -tags desktop,production -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o ww-multiplayer.exe ./cmd/ww-multiplayer
          grep -q 'requestedExecutionLevel level="asInvoker"' ww-multiplayer.exe
          ls -la ww-multiplayer.exe

      # Optional: skipped (not failed) without the WINDOWS_CERTIFICATE_*
      # secrets, leaving the unsigned exe.
      - name: Sign ww-multiplayer.exe (optional; WINDOWS_CERTIFICATE_* secrets)
        if: env.HAS_WIN_SIGNING == 'true'
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          PFX="$RUNNER_TEMP/cert.pfx"
          PASS="$RUNNER_TEMP/cert.pass"
          trap 'rm -f "$PFX" "$PASS"' EXIT
          printf '%s' "$WINDOWS_CERTIFICATE_PFX" | base64 --decode > "$PFX"
          printf '%s' "$WINDOWS_CERTIFICATE_PASSWORD" > "$PASS"
          osslsigncode sign -pkcs12 "$PFX" -readpass "$PASS" \
            -n "WW Multiplayer" -i "https://github.com/${GITHUB_REPOSITORY}" \
            -h sha256 -ts http://timestamp.digicert.com \
            -in ww-multiplayer.exe -out ww-multiplayer-signed.exe
          mv ww-multiplayer-signed.exe ww-multiplayer.exe
          ls -la ww-multiplayer.exe

      - name: No game files in ww-multiplayer.exe
        run: go run ./tools/check_game_files ww-multiplayer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ww-windows-amd64
          path: ww-multiplayer.exe

  macos:
    runs-on: macos-latest
    env:
      # "true" only when every secret the step needs exists.
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      HAS_MAC_NOTARY: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go vet
        uses: ./.github/actions/go-vet

      # Optional: puts the Developer ID certificate in a temporary keychain
      # for build-mac.sh's codesign. Skipped without the secrets; the
      # build then ad-hoc signs, as it always has.
      - name: Import Developer ID certificate (optional; MACOS_CERTIFICATE_* secrets)
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$P12"' EXIT
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          security import "$P12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KEYCHAIN"
          # Keep the existing keychains in the search list (one word each).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      # scripts/build-mac.sh compiles arm64 + amd64 (-trimpath, version
      # stamped via -X main.version, -tags desktop,production), lipos them
      # into WW Multiplayer.app (Info.plist with the tag's version, icon),
      # signs it (ad-hoc, or the Developer ID identity when the step above
      # ran) and zips it with ditto into dist/ww-multiplayer-macos.zip.
      - name: Build and zip WW Multiplayer.app
        env:
          MACOS_SIGN_IDENTITY: ${{ env.HAS_MAC_SIGNING == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: ./scripts/build-mac.sh "${GITHUB_REF_NAME}"

      # Optional: notarizes the Developer ID-signed zip, staples the ticket
      # to the app and zips it again. Skipped without the secrets.
      - name: Notarize and staple (optional; APPLE_* secrets)
        if: env.HAS_MAC_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/ww-multiplayer-macos.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/WW Multiplayer/WW Multiplayer.app"
          rm dist/ww-multiplayer-macos.zip
          ditto -c -k --keepParent "dist/WW Multiplayer" dist/ww-multiplayer-macos.zip
          spctl --assess --type execute --verbose "dist/WW Multiplayer/WW Multiplayer.app"

      - name: Remove the signing keychain
        if: always() && env.HAS_MAC_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # Opens the zip and checks every entry of the bundle.
      - name: No game files in the macOS zip
        run: go run ./tools/check_game_files dist/ww-multiplayer-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ww-macos-universal
          path: dist/ww-multiplayer-macos.zip

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      # To start pages.yml (the site) once the release exists.
      actions: write
    steps:
      # The notes file, the release-notes script and the game-files
      # guard come from the tagged commit.
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: ww-windows-amd64
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ww-macos-universal
          path: artifacts

      # One line per release asset (every file below except SHA256SUMS).
      - name: Write SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum ww-multiplayer.exe ww-multiplayer-macos.zip > SHA256SUMS
          cat SHA256SUMS

      # The assets exactly as they are published, zip entries included.
      - name: No game files in the release assets
        run: go run ./tools/check_game_files artifacts

      - name: Release notes
        id: notes
        run: |
          f=$(./scripts/release-notes.sh "${GITHUB_REF_NAME}") || { echo "$f"; exit 1; }
          echo "Release body: $f"
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/ww-multiplayer.exe
            artifacts/ww-multiplayer-macos.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.file }}

      # The site describes the latest release, so it deploys now (pages.yml
      # picks the latest release's tag). A release created with
      # GITHUB_TOKEN raises no `release` event for other workflows, hence
      # the explicit dispatch. Prereleases leave the site alone.
      - name: Deploy the website for this release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
