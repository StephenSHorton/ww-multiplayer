name: Build

# Sanity-check on every push and PR: does the Go side still build on
# every supported target (Windows + macOS)? Catches breakage between
# releases without needing the full devkitPPC toolchain — blob.go is
# committed and treated as source for build purposes.
#
# The app window (internal/gui, Wails v2) is compiled only with
# `-tags desktop,production` on Windows and macOS; every other build gets a
# stub and stays the CLI + TUI. So the Windows and macOS builds below pass
# the tags (and still build without them), while the native Linux job never
# compiles Wails and needs no webkit/GTK. Windows needs no cgo for Wails
# (go-webview2 is syscalls), so the cross-build keeps CGO_ENABLED=0.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # internal/dolphin/memory_windows.go uses Win32 APIs (kernel32.dll)
      # so vet/build needs GOOS=windows for that file to parse.
      - name: go vet (Windows target)
        uses: ./.github/actions/go-vet
        with:
          goos: windows
          goarch: amd64

      # The release exe (with the app window) and a plain `go build`
      # (CLI + TUI only) must both cross-build with cgo off.
      - name: Cross-build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -tags desktop,production -o /tmp/ww-multiplayer.exe .
          go build -o /tmp/ww-multiplayer-cli.exe .

      # ww_windows.syso (go generate; main.go) carries the icon and the
      # application manifest (packaging/ww-multiplayer.exe.manifest:
      # per-monitor DPI awareness, Common Controls 6, asInvoker). The
      # linker picks it up by itself; check it really did.
      - name: Windows exe carries the application manifest
        run: |
          grep -q 'requestedExecutionLevel level="asInvoker"' /tmp/ww-multiplayer.exe
          grep -q 'permonitorv2' /tmp/ww-multiplayer.exe

      # The C side can't be built here (devkitPPC + the owner's vanilla
      # DOL), so these check the committed blob.go against the committed
      # C sources instead: blob freshness (blob.stamp records the inputs
      # blob.go was built from), the T2 code-space budget (T2 must end
      # below the mailbox, the mailbox below the patched arena), build.py
      # and frame_shim against the blob, and the mailbox layout (Go
      # offsets vs mailbox.h). They also run in `go test ./...` below and
      # on macOS; this step names them so a failure reads as what it is.
      - name: Blob, code-space budget and mailbox layout checks
        run: >-
          go test -count=1
          -run 'TestBlobFresh|TestStampRoundTrip|TestT2EndsBelowMailbox|TestCheckBudget|TestBuildPyMatchesBlob|TestFrameShimLoadsCallbackSlot|TestMailboxLayout|TestModRegions'
          . ./internal/inject/... ./wwapi/mailbox

      # Mod manifests (wwapi v0, docs/api/02-mods.md): every mods/**/mod.json
      # against wwapi/schema/mod.schema.json, ids equal to folder names,
      # and each broken fixture refused for its invalid.txt reason. The
      # fixtures folder starts with "_", so ./... skips it: vet it by name
      # (wwapi's tests compile and run it).
      - name: Mod manifests and fixtures
        run: |
          go run ./tools/validate_manifests
          go vet ./mods/_fixtures/

      # Native Linux pass: internal/dolphin has a stub backend on
      # platforms without process-memory support (memory_other.go), so
      # the whole module vets and its unit tests run here. No
      # -tags desktop,production vet: on Linux internal/gui is the stub
      # either way, so it would vet the same files twice.
      - name: go vet + go test (native Linux)
        run: |
          go vet ./...
          go test -race -count=1 ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # internal/dolphin/memory_darwin.go uses cgo + Mach VM, so we have
      # to actually run on a Mac. The packaging step below builds native
      # arm64 (the runner) and cross-builds amd64, so both architectures
      # still compile.
      - name: go vet
        uses: ./.github/actions/go-vet

      - name: go test
        run: go test -count=1 ./...

      # The release packaging, run on every push and PR as a smoke test
      # (nothing is published): scripts/build-mac.sh builds arm64 and
      # amd64 with -tags desktop,production, lipos them into
      # WW Multiplayer.app (Info.plist, icon, ad-hoc signed with
      # cs.debugger; no signing secrets are used here), zips it with ditto
      # and unpacks the zip to check the bundle, symlink and signature
      # survived. The zip is kept for a week so a PR's .app can be tried
      # on a real Mac before a release.
      - name: Build and zip WW Multiplayer.app
        run: ./scripts/build-mac.sh "ci-${GITHUB_SHA:0:7}"

      - name: Keep the zip (workflow artifact, not a release)
        uses: actions/upload-artifact@v4
        with:
          name: ww-macos-universal-ci
          path: dist/ww-multiplayer-macos.zip
          retention-days: 7
